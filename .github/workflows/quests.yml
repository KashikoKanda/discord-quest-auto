name: Quests

# Bấm Run workflow, dán token tài khoản, gạt công tắc:
#   multi BẬT   làm mọi quest còn thiếu, lần lượt từng cái
#   multi TẮT   chỉ làm đúng quest id đã dán
#
# Quest luôn chạy tuần tự, giữa hai quest nghỉ ít nhất `gap` giây, và mỗi request
# vẫn qua hàng đợi của engine nên không dội API Discord.
#
# Workflow này CHỈ làm quest, không nhận thưởng. Muốn nhận thưởng thì chạy
# `bot.ts claim` trên máy.
#
# Token được che (***) trước khi mọi thứ khác chạy và không ghi xuống đĩa.

on:
  workflow_dispatch:
    inputs:
      token:
        description: Token tài khoản Discord (sẽ được che trong log)
        required: true
        type: string
      multi:
        description: Bật để làm tất cả quest, tắt để làm một quest
        required: false
        default: true
        type: boolean
      quest_id:
        description: Id quest, chỉ dùng khi công tắc multi đang tắt
        required: false
        type: string
      gap:
        description: Số giây nghỉ tối thiểu giữa hai quest
        required: false
        default: '10'
        type: string

permissions:
  contents: read

concurrency:
  group: quests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    name: Chạy quest
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài thư viện
        run: npm ci

      # Fingerprint là một file JSON nhỏ. Mỗi lần chạy một key mới để entry
      # không bị ghi đè; restore-keys luôn tìm được bản mới nhất, nhờ vậy tài
      # khoản giữ nguyên danh tính thiết bị giữa các lần chạy.
      - name: Khôi phục fingerprint
        uses: actions/cache/restore@v4
        with:
          path: .quest-store.json
          key: quest-store-${{ github.run_id }}
          restore-keys: |
            quest-store-

      - name: Che token
        env:
          TOKEN: ${{ inputs.token || secrets.DISCORD_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Chưa có token. Dán token vào ô khi bấm Run workflow, hoặc thêm secret DISCORD_TOKEN."
            exit 1
          fi
          echo "::add-mask::$TOKEN"

      - name: Kiểm tra ô nhập
        run: |
          set -euo pipefail
          if [ "${{ inputs.multi }}" != "true" ] && [ -z "${{ inputs.quest_id }}" ]; then
            echo "::error::Đang tắt multi thì phải nhập quest_id. Chạy bot.ts list để xem id."
            exit 1
          fi
          case "${{ inputs.gap }}" in
            ''|*[!0-9]*) echo "::error::gap phải là số giây (số nguyên)."; exit 1 ;;
          esac

      - name: Chạy
        env:
          TOKEN: ${{ inputs.token || secrets.DISCORD_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p logs
          FLAGS="--gap=${{ inputs.gap }}"
          if [ "${{ inputs.multi }}" = "true" ]; then
            echo "chế độ: tất cả quest"
          else
            FLAGS="$FLAGS --quest=${{ inputs.quest_id }}"
            echo "chế độ: một quest ${{ inputs.quest_id }}"
          fi
          echo "chạy: bot.ts run $FLAGS"
          npx tsx bot.ts run --log=logs/quest.log $FLAGS 2>&1 | tee -a logs/quest.log

      - name: In log
        if: always()
        run: cat logs/quest.log 2>/dev/null || echo "không có log"

      - name: Lưu fingerprint
        if: always() && hashFiles('.quest-store.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .quest-store.json
          key: quest-store-${{ github.run_id }}

      - name: Tải log lên
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quest-log-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
