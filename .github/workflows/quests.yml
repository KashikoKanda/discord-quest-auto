name: Quests

# Press Run workflow, paste the account token, pick what to do:
#   mode=all     every quest that still needs work, one at a time
#   mode=single  only the quest id you paste
#
# Quests always run sequentially with a gap between them, and every API call is
# spaced by the engine queue (1500-3000 ms), so a run never floods Discord.
#
# The token is masked in the log before anything else runs and is never written
# to disk. If you would rather not paste it each time, add a repository secret
# named DISCORD_TOKEN and leave the prompt empty.

on:
  workflow_dispatch:
    inputs:
      token:
        description: Discord account token (masked in the log)
        required: true
        type: string
      mode:
        description: Which quests to run
        required: true
        type: choice
        default: all
        options:
          - all
          - single
      quest_id:
        description: Quest id (only used when mode=single)
        required: false
        type: string
      gap:
        description: Minimum seconds to wait between two quests (jitter added on top)
        required: false
        default: '10'
        type: string
      claim_only:
        description: Only claim rewards for quests that already finished
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: quests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    name: Run quests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fingerprint is one small JSON file. A fresh cache key each run keeps the
      # entry immutable; restore-keys always finds the newest one, so the account
      # keeps the same device identity between runs.
      - name: Restore fingerprint
        uses: actions/cache/restore@v4
        with:
          path: .quest-store.json
          key: quest-store-${{ github.run_id }}
          restore-keys: |
            quest-store-

      - name: Mask token
        env:
          TOKEN: ${{ inputs.token || secrets.DISCORD_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::No token. Paste one into the Run workflow prompt, or add a DISCORD_TOKEN secret."
            exit 1
          fi
          echo "::add-mask::$TOKEN"

      - name: Check inputs
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = "single" ] && [ -z "${{ inputs.quest_id }}" ]; then
            echo "::error::mode=single needs quest_id. Run bot.ts list to see the ids."
            exit 1
          fi
          case "${{ inputs.gap }}" in
            ''|*[!0-9]*) echo "::error::gap must be a whole number of seconds."; exit 1 ;;
          esac

      - name: Run
        env:
          TOKEN: ${{ inputs.token || secrets.DISCORD_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p logs
          if [ "${{ inputs.claim_only }}" = "true" ]; then
            npx tsx bot.ts claim 2>&1 | tee logs/quest.log
            exit 0
          fi
          FLAGS="--gap=${{ inputs.gap }}"
          if [ "${{ inputs.mode }}" = "single" ]; then
            FLAGS="$FLAGS --quest=${{ inputs.quest_id }}"
          fi
          echo "chạy: bot.ts run $FLAGS"
          npx tsx bot.ts run --log=logs/quest.log $FLAGS 2>&1 | tee -a logs/quest.log

      - name: Show log
        if: always()
        run: cat logs/quest.log 2>/dev/null || echo "no log produced"

      - name: Save fingerprint
        if: always() && hashFiles('.quest-store.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .quest-store.json
          key: quest-store-${{ github.run_id }}

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quest-log-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
